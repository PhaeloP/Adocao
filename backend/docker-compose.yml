version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: adocao_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '102030'
      MYSQL_DATABASE: 'adocao'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

