<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="buscarUsuarios">
        Buscar todos os usuários
    </button>

    <table id="tabelaUsuarios">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Senha</th>
                <th>Celular</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        document.getElementById('buscarUsuarios').addEventListener('click', async () => {

            try {
                const response = await fetch('https://localhost:7208/api/Usuario');

                if (!response.ok) {
                    throw new Error(`Erro HTTP ${response.status}`);
                }

                const usuarios = await response.json();

                const tbody = document.querySelector('#tabelaUsuarios tbody');
                tbody.innerHTML = '';

                usuarios.forEach(usuario => {
                    const linha = `
                        <tr>
                            <td>${usuario.id}</td>
                            <td>${usuario.nome}</td>
                            <td>${usuario.email}</td>
                            <td>${usuario.senha}</td>
                            <td>${usuario.celular}</td>
                        </tr>
                    `;

                    tbody.innerHTML += linha;
                });

            } catch (erro) {
                console.error(erro);
                alert('Erro ao buscar usuários');
            }

        });
    </script>

</body>
</html>
